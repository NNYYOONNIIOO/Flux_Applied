buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net' }; mavenCentral() }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.+' }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
version = '1.2.6-1.16.5'
group = 'com.flux_applied'
archivesBaseName = 'flux_applied'
sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
minecraft {
    mappings channel: 'snapshot', version: '20210309-1.16.5'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            args '--mixin.config', 'flux_applied.mixins.json'
            mods { flux_applied { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'info'
            args '--mixin.config', 'flux_applied.mixins.json', '--nogui'
            mods { flux_applied { source sourceSets.main } }
        }
    }
}
repositories {
    mavenCentral()
    maven { url = 'https://modmaven.dev/'; content { includeGroup 'appeng' } }
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    flatDir { dirs 'libs' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.42'
    implementation fg.deobf('appeng:appliedenergistics2:8.4.7')
    implementation fg.deobf('nyonio:terminal_interaction_integration:1.2.4-1.16.5')
    implementation fg.deobf("curse.maven:jade-324717:3910873")
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-inline:3.12.4'
    annotationProcessor 'org.spongepowered:mixin:0.8:processor'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources { filesMatching('META-INF/mods.toml') { expand version: project.version } }
jar {
    manifest {
        attributes(
            'Specification-Title': 'flux_applied', 'Specification-Vendor': 'Nyonio',
            'Specification-Version': '1', 'Implementation-Title': project.name,
            'Implementation-Version': project.version, 'Implementation-Vendor': 'Nyonio',
            'MixinConfigs': 'flux_applied.mixins.json'
        )
    }
    finalizedBy 'reobfJar'
}
publishing { publications { mavenJava(MavenPublication) { artifact jar } } }
